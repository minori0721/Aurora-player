name: Check

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          DOWNLOAD_PROXY_URL: ${{ vars.DOWNLOAD_PROXY_URL }}
      - run: git diff --exit-code
      - name: Keep verified site for deployment and release
        if: matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/minori0721-test-1' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurora-site-${{ github.sha }}
          path: dist/index.html
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  pages:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/minori0721-test-1'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      artifact-name: aurora-site-${{ github.sha }}

  release:
    needs: check
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/minori0721-test-1' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      artifact-name: aurora-site-${{ github.sha }}
