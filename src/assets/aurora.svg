      <stop offset=".74" stop-color="#1FA986" stop-opacity=".85"/>
      <stop offset="1" stop-color="#087C70"/>
    </linearGradient>
    <linearGradient id="fold" x1="208" y1="235" x2="314" y2="221" gradientUnits="userSpaceOnUse">
      <stop stop-color="#AAEFCE" stop-opacity=".12"/>
      <stop offset=".53" stop-color="#B1F2CD" stop-opacity=".65"/>
      <stop offset="1" stop-color="#087C70" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="front" x1="242" y1="213" x2="266" y2="364" gradientUnits="userSpaceOnUse">
