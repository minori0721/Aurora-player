<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Aurora Player</title>
  <desc id="desc">A musical note grows out of folded green and blue aurora curtains on a transparent background.</desc>
  <defs>
